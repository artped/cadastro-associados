# Configuração da aplicação
spring.application.name=cadastro-associados
server.port=8080

# Cassandra
spring.cassandra.keyspace-name=cadastro_associados
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS

# JWT
# IMPORTANTE: defina a variável de ambiente JWT_SECRET em produção.
# O valor deve ter no mínimo 32 caracteres (256 bits) para HMAC-SHA256.
# A aplicação falhará ao iniciar se JWT_SECRET não estiver definido.
jwt.secret=${JWT_SECRET:}
jwt.expiracao=${JWT_EXPIRACAO:86400000}

# CORS
# Lista separada por vírgulas de origens permitidas. Ex.: https://app.exemplo.com,https://admin.exemplo.com
# Por padrão nenhuma origem é permitida; configure explicitamente em produção.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logs
logging.level.com.associados=INFO
logging.level.org.springframework.security=WARN
