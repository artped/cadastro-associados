# Configuração da aplicação
spring.application.name=cadastro-associados
server.port=8080

# Cassandra
spring.cassandra.keyspace-name=cadastro_associados
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS

# JWT
jwt.secret=cadastro-associados-secret-key-que-deve-ser-alterada-em-producao-2024
jwt.expiracao=86400000

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logs
logging.level.com.associados=INFO
logging.level.org.springframework.security=WARN
