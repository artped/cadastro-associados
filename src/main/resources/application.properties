# Configuração da aplicação
spring.application.name=cadastro-associados
server.port=8080

# Cassandra
spring.cassandra.keyspace-name=cadastro_associados
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS

# JWT
# O segredo JWT NÃO possui valor padrão de propósito.
# Defina a variável de ambiente JWT_SECRET com pelo menos 32 caracteres (256 bits)
# em qualquer ambiente (dev, staging, produção). A aplicação falhará ao iniciar se
# a variável não estiver configurada ou for muito curta.
jwt.secret=${JWT_SECRET:}
jwt.expiracao=${JWT_EXPIRACAO_MS:86400000}

# CORS
# Lista de origens permitidas (separadas por vírgula). Use a origem exata do(s)
# frontend(s), por exemplo: https://app.exemplo.com,https://admin.exemplo.com
# Não use "*" em produção — isso permite que qualquer site chame a API.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Swagger / OpenAPI
# Por padrão Swagger/OpenAPI exigem autenticação. Defina app.swagger.public=true
# apenas em ambientes internos onde a exposição pública da documentação é aceitável.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
app.swagger.public=${APP_SWAGGER_PUBLIC:false}

# Upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logs
logging.level.com.associados=INFO
logging.level.org.springframework.security=WARN
