# Configuração da aplicação
spring.application.name=cadastro-associados
server.port=8080

# Cassandra
spring.cassandra.keyspace-name=cadastro_associados
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS

# JWT
# IMPORTANT: Override jwt.secret via environment variable JWT_SECRET in production.
# The application will refuse to start if the default dev-only secret is used
# with a non-dev Spring profile.
jwt.secret=${JWT_SECRET:#{null}}
jwt.expiracao=86400000

# Swagger / OpenAPI
# Set springdoc.enabled=false in production to disable Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.enabled=true

# CORS
# Comma-separated list of allowed origins. Override via CORS_ALLOWED_ORIGINS env var in production.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logs
logging.level.com.associados=INFO
logging.level.org.springframework.security=WARN
