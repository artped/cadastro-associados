# Configuração para testes
spring.cassandra.keyspace-name=cadastro_associados_test
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1

# Segredo usado apenas em testes — não reutilize em outros ambientes.
jwt.secret=test-only-secret-do-not-use-in-any-deployed-environment-0000
jwt.expiracao=86400000

# Origens CORS usadas apenas em testes.
app.cors.allowed-origins=http://localhost:3000
app.swagger.public=false
